<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
  <rect width="1600" height="900" fill="#141413"/>
  <text x="80" y="100" font-size="44" font-weight="700" fill="#ffffff">Время выполнено, смысл — узкое место</text>
  <text x="80" y="148" font-size="27" fill="#c3c2b7">Синяя полоса — наш замер, оранжевая метка — требование заказчика</text>
  <g font-size="28" fill="#ffffff">
    <text x="600" y="245" text-anchor="end">Границы в допуске 2 с</text>
    <text x="600" y="278" text-anchor="end" font-size="21" fill="#8a8a86">85 роликов Assembly101, доля разрезов</text>
    <rect x="620" y="225" width="756" height="36" fill="#3987e5"/>
    <text x="1391" y="253" font-weight="700">90 %</text>

    <text x="600" y="345" text-anchor="end">Ошибка границы</text>
    <text x="600" y="378" text-anchor="end" font-size="21" fill="#8a8a86">средняя по совпавшим разрезам</text>
    <rect x="620" y="325" width="113" height="36" fill="#3987e5"/>
    <text x="748" y="353" font-weight="700">0.27 с</text>
    <line x1="1460" y1="315" x2="1460" y2="371" stroke="#d95926" stroke-width="4"/><text x="1470" y="353" fill="#f0a27f" font-size="22">2 с</text>

    <text x="600" y="445" text-anchor="end">Обработка ролика</text>
    <text x="600" y="478" text-anchor="end" font-size="21" fill="#8a8a86">30 с видео, вместе с именованием</text>
    <rect x="620" y="425" width="385" height="36" fill="#3987e5"/>
    <text x="1020" y="453" font-weight="700">≈55 с</text>
    <line x1="1460" y1="415" x2="1460" y2="471" stroke="#d95926" stroke-width="4"/><text x="1470" y="453" fill="#f0a27f" font-size="22">120 с</text>

    <text x="600" y="545" text-anchor="end">Корректный экспорт</text>
    <text x="600" y="578" text-anchor="end" font-size="21" fill="#8a8a86">JSON / CSV по контракту, проверка схемой</text>
    <rect x="620" y="525" width="840" height="36" fill="#3987e5"/>
    <text x="1470" y="553" font-weight="700">100 %</text>

    <text x="600" y="645" text-anchor="end">Шаги, IoU ≥ 0.5, без имён</text>
    <text x="600" y="678" text-anchor="end" font-size="21" fill="#8a8a86">3 снятых ролика с паузами</text>
    <rect x="620" y="625" width="521" height="36" fill="#3987e5"/>
    <text x="1156" y="653" font-weight="700">0.62</text>
    <line x1="1250" y1="615" x2="1250" y2="671" stroke="#d95926" stroke-width="4"/><text x="1260" y="653" fill="#f0a27f" font-size="22">0.75</text>

    <text x="600" y="745" text-anchor="end">Действие и объект названы верно</text>
    <text x="600" y="778" text-anchor="end" font-size="21" fill="#8a8a86">строгое правило, 197 шагов, синонимы зачтены</text>
    <rect x="620" y="725" width="361" height="36" fill="#3987e5"/>
    <text x="996" y="753" font-weight="700">0.43</text>
    <line x1="1292" y1="715" x2="1292" y2="771" stroke="#d95926" stroke-width="4"/><text x="1302" y="753" fill="#f0a27f" font-size="22">0.80</text>
  </g>
  <text x="80" y="850" font-size="23" fill="#8a8a86">Границы и скорость в допуске; именование ниже цели, и это измерено, а не спрятано. Следующий шаг: семантика, не время.</text>
</svg>
