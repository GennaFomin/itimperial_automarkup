<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
  <defs>
    <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="14" fill="#1a1a19"/><line x1="0" y1="0" x2="0" y2="14" stroke="#3987e5" stroke-width="4"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="#141413"/>
  <text x="80" y="110" font-size="44" font-weight="700" fill="#ffffff">Один 30-секундный ролик: 7 минут вручную, 3 минуты с Praxis</text>
  <text x="80" y="160" font-size="28" fill="#c3c2b7">Активное время разметчика, наш замер на снятом ролике; в пакете ожидание обработки исчезает</text>
  <!-- axis baseline at x=460, scale: 7 min = 1000px -->
  <g font-size="30" fill="#ffffff">
    <text x="440" y="330" text-anchor="end">Вручную, покадрово</text>
    <rect x="460" y="290" width="1000" height="56" rx="0" fill="#d95926"/>
    <rect x="1456" y="290" width="4" height="56" fill="#141413"/>
    <text x="1475" y="330" fill="#ffffff" font-weight="700">7:00</text>

    <text x="440" y="470" text-anchor="end">Praxis: проверить и поправить</text>
    <rect x="460" y="430" width="429" height="56" fill="#3987e5"/>
    <text x="905" y="470" fill="#ffffff" font-weight="700">3:00</text>
    <text x="1000" y="470" fill="#8fbcf5" font-size="34" font-weight="700">×2.3 быстрее</text>

    <text x="440" y="610" text-anchor="end">В пакете: только проверка</text>
    <rect x="460" y="570" width="214" height="56" fill="url(#hatch)" stroke="#3987e5" stroke-width="2"/>
    <text x="690" y="610" fill="#ffffff" font-weight="700">≈1:30</text>
    <text x="800" y="610" fill="#8a8a86" font-size="26">гипотеза, проверим на пилоте</text>
  </g>
  <line x1="460" y1="250" x2="460" y2="660" stroke="#3a3a38" stroke-width="2"/>
  <g font-size="24" fill="#8a8a86">
    <text x="80" y="760">Как измерено: таймер активной работы в самом инструменте (паузы не в счёт), режим «разметить с нуля» даёт знаменатель.</text>
    <text x="80" y="800">Обработка ролика моделью — около минуты при лимите заказчика в две; в демо ролик обработан заранее.</text>
  </g>
</svg>
